<!DOCTYPE html>
<html>
<head>
    <title>Sincronização Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .log { background: #2a2a2a; padding: 15px; border-radius: 5px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        button { background: #10b981; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px; }
        button:hover { background: #059669; }
        button:disabled { background: #6b7280; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Sincronização Completa do Firebase</h1>
        <p>Este script irá recuperar TODOS os dados do Firebase e restaurá-los no sistema.</p>
        
        <button onclick="startSync()" id="syncBtn">🚀 Iniciar Sincronização Completa</button>
        <button onclick="exportData()" id="exportBtn">📦 Exportar Dados Recuperados</button>
        <button onclick="clearBackups()" id="clearBtn">🗑️ Limpar Backups Locais</button>
        
        <div id="logContainer" class="log"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // Configuração Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDkLsTkqT7YH6N8lOYQvQZ8nJqR7wK3mP4",
            authDomain: "completamenteapp-default-rtdb.firebaseapp.com",
            databaseURL: "https://completamenteapp-default-rtdb.firebaseio.com",
            projectId: "completamenteapp-default-rtdb",
            storageBucket: "completamenteapp-default-rtdb.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abc123def456ghi789"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variáveis globais
        let clientId = null;
        let userDataCache = {};
        let userChats = {};

        // Função de log
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            logContainer.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Função principal de sincronização
        async function startSync() {
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.disabled = true;
            syncBtn.textContent = '⏳ Sincronizando...';
            
            try {
                log('🚀 Iniciando sincronização completa do Firebase...', 'info');
                
                // 1. Testar conexão
                log('🔍 Testando conexão com Firebase...', 'info');
                await testConnection();
                
                // 2. Recuperar todos os dados
                log('📥 Recuperando dados completos do Firebase...', 'info');
                const recoveredData = await recoverAllFirebaseData();
                
                if (recoveredData) {
                    log('✅ Dados recuperados com sucesso!', 'success');
                    log(`👥 Usuários: ${Object.keys(recoveredData.users).length}`, 'info');
                    log(`🖼️ Mural: ${recoveredData.mural.length} posts`, 'info');
                    log(`💬 Chats: ${Object.keys(recoveredData.chats).length}`, 'info');
                    log(`⚙️ Config Admin: ${recoveredData.admin_auth ? 'Disponível' : 'Não encontrado'}`, 'info');
                    log(`🤖 Status IA: ${Object.keys(recoveredData.ai_status).length}`, 'info');
                    
                    // 3. Salvar backup local
                    const backupKey = `firebase_backup_${new Date().toISOString()}`;
                    localStorage.setItem(backupKey, JSON.stringify(recoveredData));
                    log(`💾 Backup salvo: ${backupKey}`, 'success');
                    
                    // 4. Exibir resumo
                    log('\n🎉 SINCRONIZAÇÃO COMPLETA REALIZADA!', 'success');
                    log('✅ Todos os dados foram recuperados e backup criado!', 'success');
                    log('📦 Use "Exportar Dados" para salvar arquivo JSON', 'info');
                    log('🔄 Abra o aplicativo principal para usar os dados', 'info');
                    
                } else {
                    log('❌ Não foi possível recuperar os dados', 'error');
                }
                
            } catch (error) {
                log(`❌ Erro na sincronização: ${error.message}`, 'error');
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = '🚀 Iniciar Sincronização Completa';
            }
        }

        // Testar conexão
        async function testConnection() {
            try {
                await db.ref('.info/connected').once('value');
                log('✅ Conexão Firebase estabelecida', 'success');
            } catch (error) {
                throw new Error(`Falha na conexão: ${error.message}`);
            }
        }

        // Recuperar todos os dados
        async function recoverAllFirebaseData() {
            const recoveredData = {
                timestamp: new Date().toISOString(),
                users: {},
                mural: [],
                chats: {},
                admin_auth: null,
                ai_status: {}
            };

            try {
                // Recuperar usuários
                log('📥 Recuperando usuários...', 'info');
                const usersSnapshot = await db.ref('users').once('value');
                recoveredData.users = usersSnapshot.val() || {};
                log(`✅ ${Object.keys(recoveredData.users).length} usuários recuperados`, 'success');

                // Recuperar mural
                log('📥 Recuperando mural...', 'info');
                const muralSnapshot = await db.ref('mural').once('value');
                const muralData = muralSnapshot.val() || {};
                recoveredData.mural = Object.keys(muralData)
                    .map(id => ({ id, ...muralData[id] }))
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                log(`✅ ${recoveredData.mural.length} posts do mural recuperados`, 'success');

                // Recuperar chats
                log('📥 Recuperando chats...', 'info');
                const chatsSnapshot = await db.ref('chats').once('value');
                recoveredData.chats = chatsSnapshot.val() || {};
                log(`✅ ${Object.keys(recoveredData.chats).length} chats recuperados`, 'success');

                // Recuperar admin_auth
                log('📥 Recuperando configurações de admin...', 'info');
                const adminSnapshot = await db.ref('admin_auth').once('value');
                recoveredData.admin_auth = adminSnapshot.val();
                log('✅ Configurações de admin recuperadas', 'success');

                // Recuperar ai_status
                log('📥 Recuperando status da IA...', 'info');
                const aiStatusSnapshot = await db.ref('ai_status').once('value');
                recoveredData.ai_status = aiStatusSnapshot.val() || {};
                log(`✅ ${Object.keys(recoveredData.ai_status).length} status de IA recuperados`, 'success');

                return recoveredData;

            } catch (error) {
                log(`❌ Erro ao recuperar dados: ${error.message}`, 'error');
                return null;
            }
        }

        // Exportar dados
        function exportData() {
            const data = getRecoveredData();
            if (!data) {
                log('❌ Nenhum dado recuperado para exportar', 'error');
                return;
            }

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `firebase_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            log('📤 Dados exportados com sucesso', 'success');
        }

        // Limpar backups
        function clearBackups() {
            const backups = Object.keys(localStorage).filter(key => key.startsWith('firebase_backup_'));
            backups.forEach(key => localStorage.removeItem(key));
            log(`🗑️ ${backups.length} backups locais removidos`, 'success');
        }

        // Obter dados recuperados
        function getRecoveredData() {
            const backups = Object.keys(localStorage).filter(key => key.startsWith('firebase_backup_'));
            if (backups.length === 0) {
                log('ℹ️ Nenhum backup local encontrado', 'info');
                return null;
            }
            
            const latestBackup = backups.sort().pop();
            try {
                return JSON.parse(localStorage.getItem(latestBackup));
            } catch (error) {
                log(`❌ Erro ao ler backup: ${error.message}`, 'error');
                return null;
            }
        }

        // Verificar dados ao carregar
        window.onload = function() {
            const existingData = getRecoveredData();
            if (existingData) {
                log('📦 Backup local encontrado', 'info');
                log(`👥 Usuários: ${Object.keys(existingData.users).length}`, 'info');
                log(`🖼️ Mural: ${existingData.mural.length} posts`, 'info');
                log(`💬 Chats: ${Object.keys(existingData.chats).length}`, 'info');
            } else {
                log('ℹ️ Nenhum backup local encontrado. Execute a sincronização.', 'info');
            }
        };
    </script>
</body>
</html>
