<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Sincronização Firebase - WR TERAPIA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-container {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .log-info { color: #60a5fa; }
        .log-warning { color: #fbbf24; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div class="container mx-auto p-4 max-w-2xl">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 mb-2">
                🔄 SINCRONIZAÇÃO FIREBASE
            </h1>
            <p class="text-slate-400 text-sm">Recupere todos os seus dados importantes</p>
        </header>

        <!-- Login Section -->
        <div id="loginSection" class="glass-card p-6 mb-6 animate-fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-sky-900/50 rounded-full flex items-center justify-center mb-4 mx-auto text-sky-400">
                    <i class="fas fa-fingerprint text-2xl animate-pulse"></i>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">Acesso Seguro</h2>
                <p class="text-xs text-emerald-400 font-bold uppercase tracking-widest">
                    <i class="fas fa-shield-alt mr-1"></i>Ambiente Criptografado
                </p>
            </div>
            
            <div class="space-y-4">
                <select id="user-gender" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white font-bold outline-none">
                    <option value="" disabled selected>SELECIONE SEU GÊNERO</option>
                    <option value="M">Mulher</option>
                    <option value="H">Homem</option>
                </select>
                
                <input type="text" id="user-name-input" oninput="this.value=this.value.toUpperCase()" 
                       placeholder="PRIMEIRO E SEGUNDO NOME" 
                       class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white font-bold text-center outline-none">
                
                <input type="password" id="user-pass-input" placeholder="SENHA (DDMMAAAA)" maxlength="8" 
                       class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white font-bold text-center outline-none tracking-widest">
                
                <button onclick="doLogin()" class="w-full bg-gradient-to-r from-sky-600 to-blue-600 text-white py-3 rounded-xl font-bold hover:from-sky-500 hover:to-blue-500 transition-all">
                    <i class="fas fa-sign-in-alt mr-2"></i>ENTRAR E SINCRONIZAR
                </button>
            </div>
        </div>

        <!-- Sync Section -->
        <div id="syncSection" class="hidden">
            <!-- Status Card -->
            <div class="glass-card p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-white">
                        <i class="fas fa-user-circle mr-2 text-sky-400"></i>
                        <span id="userDisplay">Usuário</span>
                    </h3>
                    <div class="flex items-center gap-2">
                        <div id="connectionStatus" class="w-3 h-3 bg-red-500 rounded-full"></div>
                        <span id="statusText" class="text-xs text-slate-400">Offline</span>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-700 rounded-full h-2 mb-4 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-sky-500 to-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                
                <p id="progressText" class="text-xs text-slate-400 text-center">Aguardando início...</p>
            </div>

            <!-- Control Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                <button onclick="startFullSync()" id="syncBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition-all">
                    <i class="fas fa-sync mr-2"></i>Sincronizar Tudo
                </button>
                <button onclick="exportData()" class="bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold transition-all">
                    <i class="fas fa-download mr-2"></i>Exportar
                </button>
                <button onclick="clearBackups()" class="bg-red-600 hover:bg-red-500 text-white py-3 rounded-xl font-bold transition-all">
                    <i class="fas fa-trash mr-2"></i>Limpar
                </button>
            </div>

            <!-- Data Summary -->
            <div class="glass-card p-4 mb-6">
                <h4 class="text-sm font-bold text-white mb-3">📊 Resumo dos Dados</h4>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center">
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-lg font-bold text-sky-400" id="usersCount">0</div>
                        <div class="text-xs text-slate-400">Usuários</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-lg font-bold text-purple-400" id="muralCount">0</div>
                        <div class="text-xs text-slate-400">Mural</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-lg font-bold text-emerald-400" id="chatsCount">0</div>
                        <div class="text-xs text-slate-400">Chats</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-lg font-bold text-amber-400" id="adminStatus">❌</div>
                        <div class="text-xs text-slate-400">Admin</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-lg font-bold text-rose-400" id="aiStatus">0</div>
                        <div class="text-xs text-slate-400">IA</div>
                    </div>
                </div>
            </div>

            <!-- Log Container -->
            <div class="log-container p-4">
                <div class="flex items-center justify-between mb-2">
                    <h4 class="text-sm font-bold text-slate-300">📋 Logs da Sincronização</h4>
                    <button onclick="clearLogs()" class="text-xs text-slate-500 hover:text-slate-400">
                        <i class="fas fa-eraser mr-1"></i>Limpar
                    </button>
                </div>
                <div id="logContainer" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <!-- Firebase Config -->
    <script>
        // Configuração Firebase (credenciais corretas)
        const firebaseConfig = {
            apiKey: "AIzaSyCCi1hrmt4OQFlgrQThbB6-n54v5WwlJoY",
            authDomain: "completamenteapp.firebaseapp.com",
            databaseURL: "https://completamenteapp-default-rtdb.firebaseio.com",
            projectId: "completamenteapp",
            storageBucket: "completamenteapp.firebasestorage.app",
            messagingSenderId: "343038230333",
            appId: "1:343038230333:web:2338b20d2e706743b40f54"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variáveis globais
        let currentUser = null;
        let clientId = null;

        // Função de log
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            const className = `log-${type}`;
            
            const logEntry = document.createElement('div');
            logEntry.className = className;
            logEntry.innerHTML = `<span class="text-slate-500">[${timestamp}]</span> ${icon} ${message}`;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Função de login
        async function doLogin() {
            const gender = document.getElementById('user-gender').value;
            const name = document.getElementById('user-name-input').value.trim().toUpperCase();
            const pass = document.getElementById('user-pass-input').value.trim();
            
            if (!gender || name.split(' ').length < 2 || !/^[0-9]{8}$/.test(pass)) {
                alert("Atenção: Preencha todos os campos corretamente.");
                return;
            }
            
            clientId = name.replace(/\s+/g, '_');
            currentUser = name.split(' ')[0];
            
            // Atualizar interface
            document.getElementById('userDisplay').textContent = currentUser;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('syncSection').classList.remove('hidden');
            
            // Testar conexão
            updateConnectionStatus();
            
            log(`🔐 Login realizado: ${currentUser}`, 'success');
            log('🔄 Pronto para sincronização!', 'info');
        }

        // Atualizar status de conexão
        async function updateConnectionStatus() {
            const statusDiv = document.getElementById('connectionStatus');
            const statusText = document.getElementById('statusText');
            
            try {
                await db.ref('.info/connected').once('value');
                statusDiv.className = 'w-3 h-3 bg-green-500 rounded-full';
                statusText.textContent = 'Online';
                log('🟢 Conectado ao Firebase', 'success');
            } catch (error) {
                statusDiv.className = 'w-3 h-3 bg-red-500 rounded-full';
                statusText.textContent = 'Offline';
                log('🔴 Falha na conexão com Firebase', 'error');
            }
        }

        // Sincronização completa
        async function startFullSync() {
            const syncBtn = document.getElementById('syncBtn');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            syncBtn.disabled = true;
            syncBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sincronizando...';
            
            try {
                log('🚀 Iniciando sincronização completa...', 'info');
                updateProgress(10, 'Conectando ao Firebase...');
                
                // Testar conexão
                await db.ref('.info/connected').once('value');
                updateProgress(20, 'Recuperando usuários...');
                
                // Recuperar dados
                const data = await recoverAllData();
                
                if (data) {
                    updateProgress(90, 'Processando dados...');
                    updateDataSummary(data);
                    
                    // Salvar backup
                    const backupKey = `firebase_backup_${new Date().toISOString()}`;
                    localStorage.setItem(backupKey, JSON.stringify(data));
                    
                    updateProgress(100, '✅ Sincronização concluída!');
                    log('🎉 SINCRONIZAÇÃO COMPLETA REALIZADA!', 'success');
                    log(`💾 Backup salvo: ${backupKey}`, 'info');
                    
                } else {
                    throw new Error('Não foi possível recuperar os dados');
                }
                
            } catch (error) {
                log(`❌ Erro na sincronização: ${error.message}`, 'error');
                updateProgress(0, '❌ Falha na sincronização');
            } finally {
                syncBtn.disabled = false;
                syncBtn.innerHTML = '<i class="fas fa-sync mr-2"></i>Sincronizar Tudo';
            }
        }

        // Recuperar todos os dados
        async function recoverAllData() {
            const data = {
                timestamp: new Date().toISOString(),
                users: {},
                mural: [],
                chats: {},
                admin_auth: null,
                ai_status: {}
            };
            
            try {
                // Usuários
                updateProgress(30, 'Recuperando usuários...');
                const usersSnapshot = await db.ref('users').once('value');
                data.users = usersSnapshot.val() || {};
                log(`👥 ${Object.keys(data.users).length} usuários recuperados`, 'info');
                
                // Mural
                updateProgress(40, 'Recuperando mural...');
                const muralSnapshot = await db.ref('mural').once('value');
                const muralData = muralSnapshot.val() || {};
                data.mural = Object.keys(muralData)
                    .map(id => ({ id, ...muralData[id] }))
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                log(`🖼️ ${data.mural.length} posts do mural recuperados`, 'info');
                
                // Chats
                updateProgress(50, 'Recuperando chats...');
                const chatsSnapshot = await db.ref('chats').once('value');
                data.chats = chatsSnapshot.val() || {};
                log(`💬 ${Object.keys(data.chats).length} chats recuperados`, 'info');
                
                // Admin
                updateProgress(60, 'Recuperando configurações...');
                const adminSnapshot = await db.ref('admin_auth').once('value');
                data.admin_auth = adminSnapshot.val();
                log('⚙️ Configurações de admin recuperadas', 'info');
                
                // IA Status
                updateProgress(70, 'Recuperando status da IA...');
                const aiSnapshot = await db.ref('ai_status').once('value');
                data.ai_status = aiSnapshot.val() || {};
                log(`🤖 ${Object.keys(data.ai_status).length} status de IA recuperados`, 'info');
                
                return data;
                
            } catch (error) {
                log(`❌ Erro ao recuperar dados: ${error.message}`, 'error');
                return null;
            }
        }

        // Atualizar progresso
        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // Atualizar resumo de dados
        function updateDataSummary(data) {
            document.getElementById('usersCount').textContent = Object.keys(data.users).length;
            document.getElementById('muralCount').textContent = data.mural.length;
            document.getElementById('chatsCount').textContent = Object.keys(data.chats).length;
            document.getElementById('adminStatus').textContent = data.admin_auth ? '✅' : '❌';
            document.getElementById('aiStatus').textContent = Object.keys(data.ai_status).length;
        }

        // Exportar dados
        function exportData() {
            const backups = Object.keys(localStorage).filter(key => key.startsWith('firebase_backup_'));
            if (backups.length === 0) {
                log('❌ Nenhum backup para exportar', 'error');
                return;
            }
            
            const latestBackup = backups.sort().pop();
            const data = JSON.parse(localStorage.getItem(latestBackup));
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `firebase_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            log('📤 Dados exportados com sucesso', 'success');
        }

        // Limpar backups
        function clearBackups() {
            const backups = Object.keys(localStorage).filter(key => key.startsWith('firebase_backup_'));
            backups.forEach(key => localStorage.removeItem(key));
            log(`🗑️ ${backups.length} backups removidos`, 'warning');
            updateDataSummary({ users: {}, mural: [], chats: {}, admin_auth: null, ai_status: {} });
        }

        // Limpar logs
        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Sistema de Sincronização Firebase carregado', 'info');
            log('📝 Faça login para começar', 'info');
        });
    </script>
</body>
</html>
